name: Build Comprehensive Rust EPUB (Chinese)

on:
  workflow_dispatch: # 允许在 GitHub 页面手动触发
  schedule:
    - cron: "0 0 * * 0" # 每周日 UTC 00:00 自动运行一次，保持内容最新

jobs:
  build-epub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: google/comprehensive-rust
          path: comprehensive-rust
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('comprehensive-rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install mdbook and plugins
        run: |
          cd comprehensive-rust
          # 1. 安装官方构建所需的所有工具 (mdbook, mdbook-i18n-helpers, mdbook-course 等)
          cargo xtask install-tools
          # 2. 额外安装 mdbook-epub 插件以支持 EPUB 格式输出
          cargo install mdbook-epub

      - name: Configure for Chinese and EPUB
        run: |
          cd comprehensive-rust
          # 1. 启用 EPUB 输出后端
          echo -e "\n[output.epub]" >> book.toml

          # 2. 设置语言为简体中文 (zh-CN)。如需繁体中文，请将 zh-CN 改为 zh-TW
          if grep -q '^language = ' book.toml; then
            sed -i 's/^language = .*/language = "zh-CN"/' book.toml
          else
            sed -i '/^\[book\]/a language = "zh-CN"' book.toml
          fi

      - name: Build the book
        run: |
          cd comprehensive-rust
          # mdbook 会自动读取 book.toml 中的 language = "zh-CN"
          # 并调用 mdbook-i18n-helpers 加载 po/zh-CN.po 的翻译内容
          mdbook build

      - name: Upload EPUB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-rust-zh-cn-epub
          path: comprehensive-rust/book/*.epub
          retention-days: 90 # 产物保留 90 天
